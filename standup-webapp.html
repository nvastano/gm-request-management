<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Standup — Investing & Tax</title>
<style>
:root {
  --bg:       #EFF3F8;
  --card:     #FFFFFF;
  --header:   #081428;
  --accent:   #00C8A8;
  --accent2:  #00A88C;
  --warn:     #F5A623;
  --danger:   #F14C6A;
  --text:     #081428;
  --muted:    #6B7F96;
  --border:   #D8E2EE;
  --success:  #00C8A8;
  --radius:   14px;
  --shadow:   0 2px 12px rgba(8,20,40,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:     #060E1C;
    --card:   #0F1E35;
    --text:   #E4EBF5;
    --muted:  #7A90AB;
    --border: #1C3050;
    --shadow: 0 2px 16px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"] {
  --bg:#EFF3F8; --card:#FFFFFF; --text:#081428;
  --muted:#6B7F96; --border:#D8E2EE; --shadow:0 2px 12px rgba(8,20,40,.07);
}
:root[data-theme="dark"] {
  --bg:#060E1C; --card:#0F1E35; --text:#E4EBF5;
  --muted:#7A90AB; --border:#1C3050; --shadow:0 2px 16px rgba(0,0,0,.4);
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:15px}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ── HEADER ── */
.hdr{background:var(--header);color:#fff;padding:0 24px;display:flex;align-items:center;gap:0;min-height:56px;position:sticky;top:0;z-index:50}
.hdr-logo{display:flex;align-items:center;gap:10px;margin-right:28px;text-decoration:none}
.hdr-logo svg{flex-shrink:0}
.hdr-title{font-size:.95rem;font-weight:700;color:#fff;letter-spacing:.02em}
.hdr-sub{font-size:.72rem;color:rgba(255,255,255,.45);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.nav{display:flex;gap:2px;flex:1}
.nav-btn{background:transparent;border:none;color:rgba(255,255,255,.55);padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:600;letter-spacing:.02em;transition:background .15s,color .15s;white-space:nowrap}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:rgba(0,200,168,.18);color:var(--accent)}
.hdr-week{margin-left:auto;font-size:.78rem;color:rgba(255,255,255,.4);letter-spacing:.03em;white-space:nowrap;padding-left:16px}

/* ── LAYOUT ── */
.page{max-width:1080px;margin:0 auto;padding:28px 20px}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9px;border:none;font-size:.82rem;font-weight:700;letter-spacing:.02em;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 13px;font-size:.78rem}
.btn-danger{background:#fde8ec;color:var(--danger);border:none}
.btn-danger:hover{background:#fcd0d8}

/* ── SECTION HEADER ── */
.sec-hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.sec-hdr-text h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.sec-hdr-text p{font-size:.82rem;color:var(--muted);margin-top:3px}
.sec-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ── MEMBER GRID ── */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.mcard{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:20px;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.mcard-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mcard-name{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.mcard-since{font-size:.72rem;color:var(--muted)}

/* ── AVATAR ── */
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.01em;overflow:hidden}
.av-lg{width:90px;height:90px;font-size:2.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden}
.av img,.av-lg img{width:100%;height:100%;object-fit:cover;display:block}

/* ── PHOTO UPLOAD ── */
.photo-upload-wrap{display:flex;align-items:center;gap:16px}
.photo-prev{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.upload-label{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;transition:border-color .15s,color .15s}
.upload-label:hover{border-color:var(--accent);color:var(--accent)}

/* ── METRIC ROW ── */
.metric-block{margin-bottom:14px}
.metric-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.metric-name{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.metric-nums{font-size:.92rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.metric-goal{color:var(--muted);font-weight:500}

/* ── PROGRESS BAR ── */
.pbar-wrap{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.pbar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.pbar-fill.c-teal{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.pbar-fill.c-warn{background:linear-gradient(90deg,#e09020,var(--warn))}
.pbar-fill.c-red{background:linear-gradient(90deg,#d43060,var(--danger))}
.pbar-fill.c-glow{background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 8px rgba(0,200,168,.6)}
.pbar-meta{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.pbar-meta .hit{color:var(--accent);font-weight:700}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge-fire{background:rgba(0,200,168,.15);color:var(--accent)}
.badge-warn{background:rgba(245,166,35,.15);color:#b87a00}
.badge-red{background:rgba(241,76,106,.12);color:var(--danger)}

/* ── STANDUP ── */
.standup-wrap{max-width:520px;margin:0 auto}
.standup-dots{display:flex;gap:7px;justify-content:center;margin-bottom:28px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--border);transition:background .2s,transform .2s}
.sdot.done{background:var(--accent)}
.sdot.cur{background:var(--accent);transform:scale(1.4)}

.standup-card{text-align:center;padding:36px 32px}
.standup-person{font-size:2rem;font-weight:900;letter-spacing:-.03em;margin:12px 0 4px}
.standup-hint{font-size:.82rem;color:var(--muted);margin-bottom:28px}

.smetric{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:14px 16px;margin-bottom:10px;text-align:left;gap:12px}
.smetric-info{flex:1}
.smetric-name{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.smetric-goal{font-size:.72rem;color:var(--muted);margin-top:2px}
.smetric-input-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0}
.smetric-input{width:76px;padding:9px 10px;border:2px solid var(--border);border-radius:9px;font-size:1.3rem;font-weight:800;text-align:center;background:var(--card);color:var(--text);transition:border-color .15s;font-variant-numeric:tabular-nums}
.smetric-input:focus{outline:none;border-color:var(--accent)}
.smetric-of{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

.standup-nav{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}

/* ── GOALS ── */
.goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.goal-card{padding:18px 20px}
.goal-card-hd{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:1rem;font-weight:800}
.goal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.goal-row-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.goal-input{width:80px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;font-weight:700;text-align:center;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.goal-input:focus{outline:none;border-color:var(--accent)}

/* ── TEAM ADMIN ── */
.team-row{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--border)}
.team-row:last-child{border-bottom:none}
.team-info{flex:1}
.team-name{font-size:.95rem;font-weight:700}
.team-metrics{font-size:.78rem;color:var(--muted);margin-top:3px}
.team-actions{display:flex;gap:8px}

/* ── HISTORY TABLE ── */
.table-scroll{overflow-x:auto;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
thead th{padding:10px 14px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;background:var(--card)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--bg)}
.td-hit{color:var(--accent);font-weight:700}

/* ── COMPLETE SCREEN ── */
.complete-wrap{max-width:520px;margin:0 auto;text-align:center}
.complete-emoji{font-size:4.5rem;display:block;margin-bottom:12px}
.complete-title{font-size:1.8rem;font-weight:900;letter-spacing:-.03em;margin-bottom:4px}
.complete-sub{color:var(--muted);font-size:.88rem;margin-bottom:28px}
.complete-summary-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);text-align:left}
.complete-member-name{font-size:.92rem;font-weight:700;margin-bottom:2px}
.complete-member-stats{font-size:.78rem;color:var(--muted)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-box{background:var(--card);border-radius:var(--radius);padding:30px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-title{font-size:1.15rem;font-weight:800;margin-bottom:22px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-bottom:6px}
.fg input,.fg select{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:.88rem;background:var(--bg);color:var(--text)}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--accent)}
.color-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s}
.color-swatch.sel{border-color:#fff;outline:2px solid var(--accent);transform:scale(1.1)}
.metric-edit{display:flex;gap:8px;margin-bottom:8px}
.metric-edit input{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;background:var(--bg);color:var(--text)}
.metric-edit input:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}

/* ── CONFETTI ── */
#cfx{position:fixed;inset:0;pointer-events:none;z-index:999}

/* ── NOTIFICATION ── */
.toast{position:fixed;bottom:28px;right:28px;background:var(--header);color:#fff;padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:600;z-index:300;transform:translateY(80px);opacity:0;transition:transform .3s,opacity .3s;max-width:280px}
.toast.show{transform:translateY(0);opacity:1}
.toast .toast-accent{color:var(--accent)}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:56px 24px;color:var(--muted)}
.empty-state p{margin-top:8px;font-size:.9rem}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .hdr{padding:0 14px}
  .nav-btn{padding:7px 10px;font-size:.76rem}
  .hdr-title{display:none}
  .page{padding:20px 14px}
  .standup-card{padding:24px 18px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.chart-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.chart-card-hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.chart-card-name{font-weight:700;font-size:.95rem}
.chart-card-sub{font-size:.73rem;color:var(--muted)}
.view-tog{display:flex;background:var(--border);border-radius:10px;padding:3px;gap:2px}
.view-tog-btn{padding:4px 14px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;background:transparent;color:var(--muted);transition:all .15s}
.view-tog-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* ── HISTORY CARDS ── */
.hist-week{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.hist-week-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.015)}
.hist-week-title{font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.hist-member-row{display:flex;align-items:flex-start;gap:14px;padding:13px 20px;border-bottom:1px solid var(--border)}
.hist-member-row:last-child{border-bottom:none}
.hist-member-info{flex:1;min-width:0}
.hist-member-name{font-size:.82rem;font-weight:700;margin-bottom:6px}
.hist-chips{display:flex;gap:7px;flex-wrap:wrap}
.hist-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:.76rem;font-weight:600;background:var(--bg);border:1px solid var(--border);color:var(--text)}
.hist-chip-hit{background:rgba(0,200,168,.12);border-color:var(--accent);color:var(--accent)}
.hist-note-text{font-size:.76rem;color:var(--muted);margin-top:7px;font-style:italic;line-height:1.5;padding-left:1px}
</style>
</head>
<body>

<canvas id="cfx"></canvas>
<div id="app">
  <header class="hdr">
    <div class="hdr-logo">
      <svg width="54" height="40" viewBox="0 0 260 192" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rsg" x1="130" y1="32" x2="130" y2="182" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#F9A83C"/>
            <stop offset="100%" stop-color="#DF6606"/>
          </linearGradient>
        </defs>
        <!-- Navy brush stroke -->
        <path d="M -8,103 C 32,90 86,98 140,104 C 194,110 233,91 267,87 L 267,118 C 240,132 195,143 142,136 C 88,129 35,131 -8,143 Z" fill="#2B4D8C"/>
        <!-- Orange shield -->
        <path d="M 83,32 L 177,32 Q 184,32 184,39 L 184,121 Q 184,157 130,182 Q 76,157 76,121 L 76,39 Q 76,32 83,32 Z" fill="url(#rsg)"/>
        <!-- 5 gold stars — outer r=8.5, inner r=3.6 -->
        <polygon fill="#F5C424" transform="translate(80,18)"  points="0,-8.5 2.1,-2.9 8.1,-2.6 3.4,1.1 5,6.9 0,3.6 -5,6.9 -3.4,1.1 -8.1,-2.6 -2.1,-2.9"/>
        <polygon fill="#F5C424" transform="translate(105,12)" points="0,-8.5 2.1,-2.9 8.1,-2.6 3.4,1.1 5,6.9 0,3.6 -5,6.9 -3.4,1.1 -8.1,-2.6 -2.1,-2.9"/>
        <polygon fill="#F5C424" transform="translate(130,9)"  points="0,-8.5 2.1,-2.9 8.1,-2.6 3.4,1.1 5,6.9 0,3.6 -5,6.9 -3.4,1.1 -8.1,-2.6 -2.1,-2.9"/>
        <polygon fill="#F5C424" transform="translate(155,12)" points="0,-8.5 2.1,-2.9 8.1,-2.6 3.4,1.1 5,6.9 0,3.6 -5,6.9 -3.4,1.1 -8.1,-2.6 -2.1,-2.9"/>
        <polygon fill="#F5C424" transform="translate(180,18)" points="0,-8.5 2.1,-2.9 8.1,-2.6 3.4,1.1 5,6.9 0,3.6 -5,6.9 -3.4,1.1 -8.1,-2.6 -2.1,-2.9"/>
        <!-- White R -->
        <text x="130" y="136" text-anchor="middle" font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif" font-weight="900" font-size="86" fill="white">R</text>
      </svg>
      <div>
        <div class="hdr-title">Standup Tracker</div>
        <div class="hdr-sub">Investing &amp; Tax</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="standup">Standup</button>
      <button class="nav-btn" data-view="goals">Goals</button>
      <button class="nav-btn" data-view="team">Team</button>
      <button class="nav-btn" data-view="history">History</button>
    </nav>
    <div class="hdr-week" id="week-label"></div>
  </header>
  <main class="page" id="view"></main>
</div>
<div class="toast" id="toast"></div>

<div id="loading" style="display:flex;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <svg width="48" height="36" viewBox="0 0 260 192" fill="none"><defs><linearGradient id="rsg2" x1="130" y1="32" x2="130" y2="182" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#F9A83C"/><stop offset="100%" stop-color="#DF6606"/></linearGradient></defs><path d="M -8,103 C 32,90 86,98 140,104 C 194,110 233,91 267,87 L 267,118 C 240,132 195,143 142,136 C 88,129 35,131 -8,143 Z" fill="#2B4D8C"/><path d="M 83,32 L 177,32 Q 184,32 184,39 L 184,121 Q 184,157 130,182 Q 76,157 76,121 L 76,39 Q 76,32 83,32 Z" fill="url(#rsg2)"/><text x="130" y="136" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="86" fill="white">R</text></svg>
  <div style="font-size:.95rem;font-weight:600;color:var(--text);opacity:.7">Loading standup data…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── CONSTANTS ──────────────────────────────────────────────────────

          if(defMet&&met.name!==defMet.name){ met.name=defMet.name; patched=true; }
        });

// ── DATE UTILS ─────────────────────────────────────────────────────
function weekStart(date){
  const d=new Date(date), day=d.getDay(), diff=d.getDate()-day+(day===0?-6:1);
  return new Date(d.setDate(diff)).toISOString().split('T')[0];
}
function fmtWeek(ws){
  const s=new Date(ws+'T12:00:00'),e=new Date(ws+'T12:00:00');
  e.setDate(e.getDate()+4);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return s.getMonth()===e.getMonth()
    ?`${M[s.getMonth()]} ${s.getDate()}–${e.getDate()}`
    :`${M[s.getMonth()]} ${s.getDate()} – ${M[e.getMonth()]} ${e.getDate()}`;
}
function today(){ return new Date().toISOString().split('T')[0] }
const curWS = ()=> weekStart(new Date());

// ── HELPERS ────────────────────────────────────────────────────────
const color = i => COLORS[i % COLORS.length];
function pct(actual,goal){ return goal>0?Math.min(100,Math.round(actual/goal*100)):0 }
function pctClass(p){ return p>=100?'c-glow':p>=80?'c-teal':p>=50?'c-warn':'c-red' }
function uid(){ return Math.random().toString(36).slice(2,8) }

function avHTML(m, w=38){
  const sz=w>70?'2.2rem':w>44?'1.1rem':'.85rem';
  const ring=m.photo?`box-shadow:0 0 0 2.5px ${color(m.ci)}55;`:'';
  const base=`width:${w}px;height:${w}px;border-radius:50%;overflow:hidden;flex-shrink:0;${ring}`;
  if(m.photo) return `<div style="${base}background:${color(m.ci)}"><img src="${m.photo}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  return `<div style="${base}background:${color(m.ci)};display:flex;align-items:center;justify-content:center;font-size:${sz};font-weight:800;color:#fff;letter-spacing:-.01em">${m.name[0]}</div>`;
}

function resizeImage(src,max,cb){
  const img=new Image();
  img.onload=()=>{
    const r=Math.min(max/img.width,max/img.height,1);
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',.82));
  };
  img.src=src;
}

function previewPhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>resizeImage(e.target.result,220,url=>{
    window._photoData=url;
    const prev=document.getElementById('photo-prev');
    if(prev) prev.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
  });
  reader.readAsDataURL(file);
}

function latestEntry(memberId, ws){
  const d=DB.get();
  return d.entries.filter(e=>e.memberId===memberId&&e.weekStart===ws)
    .sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
}
function getGoal(memberId, metricId, ws){
  const d=DB.get();
  return d.weeklyGoals[ws]?.[memberId]?.[metricId]||0;
}
function activeMembers(){ return DB.get().members.filter(m=>m.active) }

// ── DASHBOARD ──────────────────────────────────────────────────────
function renderDash(){
  const ws=curWS(), members=activeMembers();
  let noGoals=true;
  const cards=members.map(m=>{
    const entry=latestEntry(m.id,ws);
    const blocks=m.metrics.map(met=>{
      const actual=entry?.values?.[met.id]??0;
      const goal=getGoal(m.id,met.id,ws);
      if(!goal) return ''; // skip metrics with no goal set this week
      noGoals=false;
      const p=pct(actual,goal);
      const cls=pctClass(p);
      const rem=Math.max(0,goal-actual);
      return `<div class="metric-block">
        <div class="metric-label-row">
          <span class="metric-name">${met.name}</span>
          <span class="metric-nums">${actual}<span class="metric-goal">/${goal}</span></span>
        </div>
        <div class="pbar-wrap"><div class="pbar-fill ${cls}" style="width:${p}%"></div></div>
        <div class="pbar-meta">
          <span>${p}%</span>
          ${rem>0?`<span>${rem} to go</span>`:`<span class="hit">Goal hit ✓</span>`}
        </div>
      </div>`;
    }).join('');

    const allHit=goal=>m.metrics.every(met=>{
      const a=entry?.values?.[met.id]??0; const g=getGoal(m.id,met.id,ws);
      return g>0&&a>=g;
    });
    const allDone=m.metrics.every(met=>{const a=entry?.values?.[met.id]??0;const g=getGoal(m.id,met.id,ws);return g>0&&a>=g;});

    return `<div class="mcard">
      <div class="mcard-head">
        ${avHTML(m,48)}
        <div>
          <div class="mcard-name">${m.name}</div>
          <div class="mcard-since">${entry?'Updated '+entry.date:'No entry this week'}</div>
        </div>
        ${allDone?'<span class="badge badge-fire" style="margin-left:auto">🔥 On fire</span>':''}
      </div>
      ${blocks}
    </div>`;
  }).join('');

  const noBanner=noGoals?`<div style="background:rgba(245,166,35,.12);border:1.5px solid rgba(245,166,35,.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:.85rem;color:#b87a00;display:flex;align-items:center;gap:10px">
    <span>⚠️</span><span>No goals set for this week. <a href="#" onclick="go('goals');return false" style="color:#b87a00;font-weight:700;text-decoration:underline">Set them now →</a></span>
  </div>`:'';

  document.getElementById('view').innerHTML=`
    <div class="sec-hdr">
      <div class="sec-hdr-text"><h2>Weekly Dashboard</h2><p>${fmtWeek(ws)}</p></div>
      <div class="sec-actions">
        <button class="btn btn-primary" onclick="go('standup')">▶ Start Standup</button>
        <button class="btn btn-ghost" onclick="go('goals')">🎯 Goals</button>
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">⬇ Export</button>
      </div>
    </div>
    ${noBanner}
    <div class="member-grid">${cards||'<p style="color:var(--muted)">No active team members. Add some in the Team tab.</p>'}</div>
  `;
}

// ── STANDUP ────────────────────────────────────────────────────────
function renderStandup(){
  const ws=curWS(), members=activeMembers();
  if(!members.length){
    document.getElementById('view').innerHTML=`<div class="empty-state">No active team members.<br><a href="#" onclick="go('team');return false" style="color:var(--accent);font-weight:700">Add team members →</a></div>`;
    return;
  }
  if(standupWS!==ws){ standupWS=ws; standupIdx=0; }
  if(standupIdx>=members.length){ renderStandupDone(); return; }

  const m=members[standupIdx];
  const entry=latestEntry(m.id,ws);

  const dots=members.map((_,i)=>`<div class="sdot ${i<standupIdx?'done':i===standupIdx?'cur':''}"></div>`).join('');
  const smetrics=m.metrics.map(met=>{
    const goal=getGoal(m.id,met.id,ws);
    const cur=entry?.values?.[met.id]??'';
    return `<div class="smetric">
      <div class="smetric-info">
        <div class="smetric-name">${met.name}</div>
        <div class="smetric-goal">Weekly goal: ${goal||'—'}</div>
      </div>
      <div class="smetric-input-wrap">
        <input class="smetric-input" type="number" id="si-${met.id}" min="0" value="${cur}" placeholder="0">
        <span class="smetric-of">/ ${goal}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('view').innerHTML=`
    <div class="standup-wrap">
      <div class="standup-dots">${dots}</div>
      <div class="card standup-card">
        <div style="margin:0 auto;width:90px">${avHTML(m,90)}</div>
        <div class="standup-person">${m.name}</div>
        <div class="standup-hint">${standupIdx+1} of ${members.length} · Enter this week's cumulative totals</div>
        ${smetrics}
        <div class="standup-nav">
          ${standupIdx>0?`<button class="btn btn-ghost" onclick="sprev()">← Back</button>`:''}
          <button class="btn btn-primary" onclick="ssave()">
            ${standupIdx===members.length-1?'Finish ✓':'Save & Next →'}
          </button>
        </div>
      </div>
      <div style="margin-top:14px;text-align:center">
        <button class="btn btn-ghost btn-sm" onclick="go('dashboard')">← Dashboard</button>
      </div>
    </div>
  `;
  document.querySelector('.smetric-input')?.focus();
  document.querySelectorAll('.smetric-input').forEach(inp=>{
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') ssave(); });
  });
}

function sprev(){ if(standupIdx>0){standupIdx--;renderStandup();} }

function ssave(){
  const ws=curWS(), members=activeMembers(), m=members[standupIdx];
  const d=DB.get(), values={};
  m.metrics.forEach(met=>{
    const v=parseInt(document.getElementById(`si-${met.id}`)?.value)||0;
    values[met.id]=v;
  });
  const idx=d.entries.findIndex(e=>e.memberId===m.id&&e.date===today());
  const entry={id:uid(),date:today(),weekStart:ws,memberId:m.id,values};
  if(idx>=0) d.entries[idx]=entry; else d.entries.push(entry);
  DB.save(d);

  const goalsHit=m.metrics.every(met=>{
    return getGoal(m.id,met.id,ws)>0&&(values[met.id]||0)>=getGoal(m.id,met.id,ws);
  });
  if(goalsHit) confetti();

  standupIdx++;
  renderStandup();
}

function renderStandupDone(){
  const ws=curWS(), members=activeMembers();
  const rows=members.map(m=>{
    const e=latestEntry(m.id,ws);
    const stats=m.metrics.map(met=>{
      const a=e?.values?.[met.id]??0, g=getGoal(m.id,met.id,ws);
      const p=pct(a,g);
      return `${met.name}: <strong>${a}/${g}</strong> (${p}%)`;
    }).join(' · ');
    return `<div class="complete-summary-row">
      ${avHTML(m,38)}
      <div><div class="complete-member-name">${m.name}</div><div class="complete-member-stats">${stats}</div></div>
    </div>`;
  }).join('');

  document.getElementById('view').innerHTML=`
    <div class="complete-wrap">
      <div class="card" style="padding:36px 28px">
        <span class="complete-emoji">🎉</span>
        <div class="complete-title">Standup Complete!</div>
        <div class="complete-sub">${fmtWeek(ws)}</div>
        ${rows}
        <div class="standup-nav" style="margin-top:24px">
          <button class="btn btn-primary" onclick="go('dashboard')">View Dashboard</button>
          <button class="btn btn-ghost" onclick="standupIdx=0;renderStandup()">Run Again</button>
        </div>
      </div>
    </div>
  `;
}

function renderGoals(){
  const ws=curWS(), members=activeMembers();
  const d=DB.get();
  const hasPrev=Object.keys(d.weeklyGoals).filter(w=>w<ws).length>0;

  const cards=members.map(m=>`

    <p style="margin-top:14px;font-size:.78rem;color:var(--muted)">Goals are saved per week — changes here won't affect past records.</p>
  `;
}

function saveGoals(){
  const ws=curWS(), d=DB.get(), members=activeMembers();
  if(!d.weeklyGoals[ws]) d.weeklyGoals[ws]={};
  members.forEach(m=>{
    if(!d.weeklyGoals[ws][m.id]) d.weeklyGoals[ws][m.id]={};
    m.metrics.forEach(met=>{
      const inp=document.getElementById(`g-${m.id}-${met.id}`);
      if(inp) d.weeklyGoals[ws][m.id][met.id]=parseInt(inp.value)||0;
    });
  });
  DB.save(d);
  toast('Goals saved ✓');
}

function copyLastWeek(){
  const ws=curWS(), d=DB.get();
  const prev=Object.keys(d.weeklyGoals).filter(w=>w<ws).sort().reverse()[0];
  if(!prev){toast('No previous goals found');return;}
  if(!d.weeklyGoals[ws]) d.weeklyGoals[ws]={};
  Object.assign(d.weeklyGoals[ws],JSON.parse(JSON.stringify(d.weeklyGoals[prev])));
  DB.save(d);
  renderGoals();
  toast('Goals copied from last week');
}

function addMetric(){

function closeModal(){ document.getElementById('modal')?.remove(); }

function saveMember(exId){
  const name=(document.getElementById('mname').value||'').trim();
  if(!name){toast('Please enter a name');return;}
  const ci=parseInt(document.getElementById('mci').value)||0;
  const metrics=[];
  document.querySelectorAll('[id^="mn-"]').forEach(inp=>{
    const n=(inp.value||'').trim();
    if(n){
      const sid=n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24);
      metrics.push({id:sid+'_'+uid().slice(0,3),name:n});
    }
  });
  if(!metrics.length){toast('Add at least one metric');return;}
  const d=DB.get();
  const ex=exId?d.members.find(m=>m.id===exId):null;
  const photo=window._photoData!==undefined?window._photoData:(ex?.photo||null);
  window._photoData=undefined;
  if(exId){
    const idx=d.members.findIndex(m=>m.id===exId);
    if(idx>=0) d.members[idx]={...d.members[idx],name,ci,metrics,photo};
  } else {
    const id=name.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,20)+'_'+uid().slice(0,4);
    d.members.push({id,name,active:true,ci,metrics,photo});
  }
  DB.save(d);
  closeModal();
  renderTeam();
  toast(exId?'Member updated':'Member added ✓');
}

function deleteMember(id){
  if(!confirm('Delete this member? Their history stays in the data.')) return;
  const d=DB.get();
  d.members=d.members.filter(m=>m.id!==id);
  DB.save(d);
  closeModal();
  renderTeam();
}

// ── HISTORY ────────────────────────────────────────────────────────
function renderHistory(){
  if(histMode==='charts'){ renderHistoryCharts(); return; }
  const d=DB.get(), members=activeMembers();
  const weeks=[...new Set(d.entries.map(e=>e.weekStart))].sort().reverse();

  const toggleHTML=`<div class="view-tog">
    <button class="view-tog-btn active">Cards</button>
    <button class="view-tog-btn" onclick="setHistMode('charts')">Charts</button>
  </div>`;

  if(!weeks.length){
    document.getElementById('view').innerHTML=`<div class="sec-hdr"><div class="sec-hdr-text"><h2>History</h2><p>All-time records</p></div><div style="display:flex;gap:8px;margin-left:auto;align-items:center">${toggleHTML}<button class="btn btn-primary" onclick="openAddWeekModal()">+ Add Past Week</button></div></div>
    <div class="empty-state">No entries yet.<p>Run your first standup or add a past week to start building history.</p></div>`;
    return;
  }

  const weekCards=weeks.map(ws=>{
    const memberRows=members.map(m=>{
      const e=d.entries.filter(x=>x.memberId===m.id&&x.weekStart===ws).sort((a,b)=>b.date.localeCompare(a.date))[0];
      const chips=m.metrics.map(mt=>{
        const a=e?.values?.[mt.id];
        const g=getGoal(m.id,mt.id,ws);
        const hit=g>0&&typeof a==='number'&&a>=g;
        if(a===undefined) return '';
        return `<span class="hist-chip${hit?' hist-chip-hit':''}">${mt.name}: ${g>0?a+'/'+g:a}${hit?' ✓':''}</span>`;
      }).filter(Boolean).join('');
      const note=e?.note?`<div class="hist-note-text">"${e.note}"</div>`:'';
      return `<div class="hist-member-row">
        ${avHTML(m,32)}
        <div class="hist-member-info">
          <div class="hist-member-name">${m.name}</div>
          <div class="hist-chips">${chips||`<span style="font-size:.76rem;color:var(--muted)">No data</span>`}</div>
          ${note}
        </div>
      </div>`;
    }).join('');
    return `<div class="hist-week">
      <div class="hist-week-hdr">
        <span class="hist-week-title">${fmtWeek(ws)}</span>
        <button class="btn btn-ghost btn-sm" onclick="openHistEdit('${ws}')">Edit</button>
      </div>
      ${memberRows}
    </div>`;
  }).join('');

  document.getElementById('view').innerHTML=`
    <div class="sec-hdr">
      <div class="sec-hdr-text"><h2>History</h2><p>${weeks.length} week${weeks.length!==1?'s':''} on record</p></div>
      <div style="display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap">
        ${toggleHTML}
        <button class="btn btn-primary" onclick="openAddWeekModal()">+ Add Past Week</button>
        <button class="btn btn-ghost" onclick="exportCSV()">⬇ Export CSV</button>
      </div>
    </div>
    ${weekCards}
  `;
}

function saveHistEdit(ws){
  const d=DB.get(), members=activeMembers();
  members.forEach(m=>{
    const values={};
    let hasAny=false;
    m.metrics.forEach(met=>{
      const inp=document.getElementById(`he-${m.id}-${met.id}`);
      if(inp&&inp.value!==''){
        values[met.id]=parseInt(inp.value)||0;
        hasAny=true;
      }
    });
    const note=(document.getElementById(`he-note-${m.id}`)?.value||'').trim();
    if(!hasAny&&!note) return;
    const idx=d.entries.findIndex(e=>e.memberId===m.id&&e.weekStart===ws);
    if(idx>=0){
      d.entries[idx]={...d.entries[idx],values,note};
    } else {
      d.entries.push({id:uid(),date:ws,weekStart:ws,memberId:m.id,values,note});
    }

  DB.save(d);
  closeHistModal();
  renderHistory();
  toast('Week updated ✓');
}

function saveNewWeek(){
  const dateInp=document.getElementById('aw-date');
  if(!dateInp?.value){ toast('Please pick a week'); return; }
  const ws=weekStart(dateInp.value);
  const d=DB.get(), members=activeMembers();

  members.forEach(m=>{
    const goalVals={}, entryVals={};
    let hasGoal=false, hasEntry=false;
    m.metrics.forEach(met=>{
      const gInp=document.getElementById(`aw-goal-${m.id}-${met.id}`);
      const vInp=document.getElementById(`aw-val-${m.id}-${met.id}`);
      if(gInp?.value!==''){ goalVals[met.id]=parseInt(gInp.value)||0; hasGoal=true; }
      if(vInp?.value!==''){ entryVals[met.id]=parseInt(vInp.value)||0; hasEntry=true; }
    });
    const note=(document.getElementById(`aw-note-${m.id}`)?.value||'').trim();
    if(hasGoal){
      if(!d.weeklyGoals[ws]) d.weeklyGoals[ws]={};
      d.weeklyGoals[ws][m.id]={...d.weeklyGoals[ws][m.id],...goalVals};
    }
    if(hasEntry||note){
      const idx=d.entries.findIndex(e=>e.memberId===m.id&&e.weekStart===ws);
      if(idx>=0){ d.entries[idx]={...d.entries[idx],values:entryVals,note}; }
      else { d.entries.push({id:uid(),date:ws,weekStart:ws,memberId:m.id,values:entryVals,note}); }
    }
  });

  DB.save(d);
  closeHistModal();
  renderHistory();
  toast(`Week of ${fmtWeek(ws)} saved ✓`);
}

function buildSparkline(m,weeks,d,w,h){
  if(!weeks.length) return `<div style="height:${h}px;display:flex;align-items:center;justify-content:center;font-size:.75rem;opacity:.4">No data yet</div>`;
  const met=m.metrics[0];
  const recent=weeks.slice(-10);
  const actuals=recent.map(ws=>{
    const e=d.entries.filter(x=>x.memberId===m.id&&x.weekStart===ws).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return e?.values?.[met.id]??null;
  });
  const goals=recent.map(ws=>d.weeklyGoals[ws]?.[m.id]?.[met.id]??null);
  const allV=[...actuals,...goals].filter(v=>v!==null&&v>0);
  if(!allV.length) return `<div style="height:${h}px;display:flex;align-items:center;justify-content:center;font-size:.75rem;opacity:.4">No data yet</div>`;
  const maxV=Math.max(...allV);
  const n=recent.length;
  const step=(w-12)/n;
  const bw=Math.max(6,step*0.62);
  const bars=actuals.map((v,i)=>{
    if(v===null) return '';
    const x=(6+i*step+(step-bw)/2).toFixed(1);
    const bh=Math.max(2,Math.round((v/maxV)*(h-6)));
    const y=h-bh;
    const hit=goals[i]!==null&&goals[i]>0&&v>=goals[i];
    return `<rect x="${x}" y="${y}" width="${bw.toFixed(1)}" height="${bh}" rx="2.5" fill="${hit?'#22c55e':color(m.ci)}" opacity=".85"/>`;
  }).join('');
  const dots=goals.map((g,i)=>{
    if(!g) return '';
    const cx=(6+i*step+step/2).toFixed(1);
    const cy=h-Math.round((g/maxV)*(h-6));
    return `<circle cx="${cx}" cy="${cy}" r="2.5" fill="${color(m.ci)}" opacity=".45"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${bars}${dots}</svg>`;
}

function buildMetricChart(mid,met,weeks,d){
  if(!weeks.length) return '<div style="height:180px;display:flex;align-items:center;justify-content:center;opacity:.4">No data</div>';
  const W=620,H=190;
  const PAD={top:20,right:16,bottom:40,left:40};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
  const actuals=weeks.map(ws=>{
    const e=d.entries.filter(x=>x.memberId===mid&&x.weekStart===ws).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return e?.values?.[met.id]??null;
  });
  const goals=weeks.map(ws=>d.weeklyGoals[ws]?.[mid]?.[met.id]??null);
  const allV=[...actuals,...goals].filter(v=>v!==null&&v>0);
  if(!allV.length) return '<div style="height:180px;display:flex;align-items:center;justify-content:center;opacity:.4">No data</div>';
  const rawMax=Math.max(...allV);
  const yMax=Math.ceil(rawMax*1.2/5)*5||10;
  const n=weeks.length, step=cW/n, bw=Math.max(10,step*0.55);
  const xc=i=>PAD.left+i*step+step/2;
  const yv=v=>PAD.top+cH-(v/yMax)*cH;
  const m=d.members.find(x=>x.id===mid);
  const mc=color(m.ci);
  let grid='',yLbls='';
  for(let i=0;i<=4;i++){
    const v=Math.round(yMax/4*i), y=yv(v);
    grid+=`<line x1="${PAD.left}" y1="${y.toFixed(1)}" x2="${PAD.left+cW}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    yLbls+=`<text x="${PAD.left-5}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  }
  const bars=actuals.map((v,i)=>{
    if(v===null) return '';
    const g=goals[i]; const hit=g!==null&&g>0&&v>=g;
    const x=(xc(i)-bw/2).toFixed(1);
    const bh=Math.max(2,(v/yMax)*cH);
    const y=(PAD.top+cH-bh).toFixed(1);
    const tip=`${met.name}: ${v}${g!==null?' / Goal: '+g:''}`;
    return `<rect x="${x}" y="${y}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${hit?'#22c55e':mc}" opacity=".85" onmouseenter="showChartTip(event,'${tip}')" onmouseleave="hideChartTip()"/>
            <text x="${xc(i).toFixed(1)}" y="${(parseFloat(y)-4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="${hit?'#22c55e':mc}" font-weight="600">${v}</text>`;
  }).join('');
  const gPts=goals.map((g,i)=>g!==null&&g>0?{x:xc(i),y:yv(g),g,i}:null).filter(Boolean);
  let goalPath='';
  if(gPts.length>1){
    let pd=`M ${gPts[0].x.toFixed(1)} ${gPts[0].y.toFixed(1)}`;
    for(let k=1;k<gPts.length;k++){
      const pr=gPts[k-1],cu=gPts[k],mx=((pr.x+cu.x)/2).toFixed(1);
      pd+=` L ${mx} ${pr.y.toFixed(1)} L ${mx} ${cu.y.toFixed(1)} L ${cu.x.toFixed(1)} ${cu.y.toFixed(1)}`;
    }
    goalPath=`<path d="${pd}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 3" opacity=".6"/>`;
    goalPath+=gPts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--muted)" opacity=".7" onmouseenter="showChartTip(event,'Goal: ${p.g}')" onmouseleave="hideChartTip()"/>`).join('');
  } else if(gPts.length===1){
    const p=gPts[0];
    goalPath=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--muted)" opacity=".7" onmouseenter="showChartTip(event,'Goal: ${p.g}')" onmouseleave="hideChartTip()"/>`;
  }
  const xLbls=weeks.map((ws,i)=>{
    const dt=new Date(ws+'T12:00:00');
    const lbl=`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]} ${dt.getDate()}`;
    return `<text x="${xc(i).toFixed(1)}" y="${PAD.top+cH+20}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${lbl}</text>`;
  }).join('');
  const axes=`<line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top+cH}" stroke="var(--border)" stroke-width="1"/>
              <line x1="${PAD.left}" y1="${PAD.top+cH}" x2="${PAD.left+cW}" y2="${PAD.top+cH}" stroke="var(--border)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">${grid}${axes}${bars}${goalPath}${yLbls}${xLbls}</svg>`;
}

function showChartTip(e,text){
  let t=document.getElementById('chart-tip');
  if(!t){t=document.createElement('div');t.id='chart-tip';t.style.cssText='position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:.82rem;pointer-events:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap;transition:opacity .1s';document.body.appendChild(t);}
  t.textContent=text;t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY-8)+'px';t.style.opacity='1';
}
function hideChartTip(){const t=document.getElementById('chart-tip');if(t)t.style.opacity='0';}
function closeMemberChart(){document.getElementById('member-chart-modal')?.remove();document.getElementById('chart-tip')?.remove();}

// ── EXPORT ─────────────────────────────────────────────────────────
function exportCSV(){
  const d=DB.get(), members=d.members;
  const hdr=['Date','Week','Member',...members.flatMap(m=>m.metrics.map(mt=>`${m.name} - ${mt.name}`))];
  const rows=[hdr.join(',')];
  [...d.entries].sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{
    const m=members.find(x=>x.id===e.memberId); if(!m) return;
    const cols=[e.date,e.weekStart,m.name];
    members.forEach(mem=>mem.metrics.forEach(mt=>{
      cols.push(mem.id===m.id?(e.values[mt.id]??''):'');
    }));
    rows.push(cols.join(','));
  });
  const csv=rows.join('\n');
  if(window.claude?.downloads){
    window.claude.downloads.save({filename:`standup-${today()}.csv`,data:csv});
  } else {
    const a=document.createElement('a');
    a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download=`standup-${today()}.csv`;
    a.click();
  }
}

// ── TOAST ──────────────────────────────────────────────────────────
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2400);
}

// ── CONFETTI ───────────────────────────────────────────────────────
function confetti(){
  const c=document.getElementById('cfx');
  c.width=window.innerWidth; c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  const parts=Array.from({length:90},()=>({
    x:Math.random()*c.width, y:-20, r:Math.random()*7+3,
    col:['#00C8A8','#6366F1','#F59E0B','#F14C6A','#3B82F6'][Math.floor(Math.random()*5)],
    vx:(Math.random()-.5)*5, vy:Math.random()*4+2, rot:Math.random()*360, rv:(Math.random()-.5)*12
  }));
  let f=0;
  const anim=()=>{
    ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.col; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r); ctx.restore();
      p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.rot+=p.rv;
    });
    if(++f<110) requestAnimationFrame(anim);
    else ctx.clearRect(0,0,c.width,c.height);
  };
  anim();
}

  await DB.load();
  DB.subscribe();
  document.getElementById('week-label').textContent='Week of '+fmtWeek(curWS());
  render();
  document.getElementById('loading').style.display='none';
})();
